name: Release

# Builds, signs (self-signed certificate, no notarization) and publishes Hidebar, then updates the Homebrew tap. Three ways in:
#   - Run workflow with `bump`: the `tag` job creates the next vX.Y.Z tag on main, then `release` runs;
#   - push a tag vMAJOR.MINOR.PATCH by hand;
#   - Run workflow with `tag`: re-release an existing tag.
# See docs/RELEASING.md for the secrets this needs.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      bump:
        description: "Create the next version tag from main and release it (leave 'none' when giving a tag)"
        required: true
        type: choice
        default: none
        options: [none, patch, minor, major]
      tag:
        description: "Existing tag to release again (leave empty when giving a bump)"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  # Every bump run shares one group, so two button presses cannot race for the same tag.
  group: release-${{ (inputs.bump && inputs.bump != 'none') && 'bump' || inputs.tag || github.ref_name }}
  cancel-in-progress: false

env:
  # Releases ship from the Xcode 27.0 GA the image selects by default, the same one ci.yml uses.
  # "Require the pinned Xcode" fails unless the version and the build below match exactly.
  DEVELOPER_DIR: /Applications/Xcode_27.0.app/Contents/Developer
  XCODE_VERSION: "27.0"
  # Build of the GA Xcode 27.0, as images/macos/xcode-27-arm64-Readme.md in actions/runner-images
  # lists it (image 20261012.0260). Empty fails the check.
  XCODE_BUILD: "27A266a"

jobs:
  # The tag is created here, inside the same run: a tag pushed with GITHUB_TOKEN does not trigger
  # the push-tag trigger above, so a separate tag-triggered run would never start.
  tag:
    if: github.event_name == 'workflow_dispatch' && inputs.bump != 'none'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    outputs:
      tag: ${{ steps.create.outputs.tag }}
    env:
      BUMP: ${{ inputs.bump }}
      INPUT_TAG: ${{ inputs.tag }}
    steps:
      - name: Check inputs and ref
        run: |
          set -euo pipefail
          if [ -n "$INPUT_TAG" ]; then
            echo "give either a bump or an existing tag, not both" >&2
            exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "a version bump releases main; this run is on $GITHUB_REF" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: false

      - name: Require green CI on this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          passed="$(gh api "repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&event=push&status=success" \
            --jq '.total_count')"
          if [[ ! "$passed" =~ ^[0-9]+$ ]]; then
            echo "unexpected CI run count '$passed' for $SHA" >&2
            exit 1
          fi
          if [ "$passed" -lt 1 ]; then
            echo "no successful CI push run for $SHA; wait for CI to pass on main" >&2
            exit 1
          fi

      - name: Refuse a commit that already has a version tag
        run: |
          set -euo pipefail
          existing="$(git tag --points-at HEAD --list 'v*')"
          if [ -n "$existing" ]; then
            echo "HEAD is already tagged: $existing" >&2
            exit 1
          fi

      - name: Create and push the tag
        id: create
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          version="$(bash scripts/next_version.sh "$BUMP")"
          tag="v$version"
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            tag -a "$tag" -m "Hidebar $version"
          gh auth setup-git --hostname github.com
          git push origin "refs/tags/$tag"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  release:
    needs: tag
    # `tag` is skipped for a pushed tag or the `tag` input; a failed or cancelled `tag` must not release.
    if: ${{ !cancelled() && (needs.tag.result == 'success' || needs.tag.result == 'skipped') }}
    runs-on: xcode-27
    timeout-minutes: 90
    permissions:
      contents: write
    env:
      TAG: ${{ needs.tag.outputs.tag || inputs.tag || github.ref_name }}
      INPUT_BUMP: ${{ inputs.bump }}
      INPUT_TAG: ${{ inputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate inputs
        run: |
          set -euo pipefail
          if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ] && [ "$INPUT_BUMP" = "none" ] && [ -z "$INPUT_TAG" ]; then
            echo "set either a bump or an existing tag" >&2
            exit 1
          fi
          if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "tag '$TAG' is not vMAJOR.MINOR.PATCH" >&2
            exit 1
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          fetch-depth: 0
          persist-credentials: false

      - name: Prepare
        run: |
          set -euo pipefail
          {
            echo "VERSION=${TAG#v}"
            echo "KEYCHAIN_PATH=$RUNNER_TEMP/hidebar-release.keychain-db"
            echo "APP=build/dd/Build/Products/Release/Hidebar.app"
            echo "DMG=build/Hidebar-${TAG#v}.dmg"
          } >> "$GITHUB_ENV"

      - name: Require the pinned Xcode
        run: |
          set -euo pipefail
          if [ -z "$XCODE_BUILD" ]; then
            echo "set XCODE_BUILD to the GA build of Xcode $XCODE_VERSION from the runner image notes" >&2
            exit 1
          fi
          version="$(xcodebuild -version)"
          echo "$version"
          if [ "$(printf '%s\n' "$version" | sed -n 1p)" != "Xcode $XCODE_VERSION" ]; then
            echo "expected Xcode $XCODE_VERSION, got a different toolchain" >&2
            exit 1
          fi
          if [ "$(printf '%s\n' "$version" | sed -n 2p)" != "Build version $XCODE_BUILD" ]; then
            echo "expected build $XCODE_BUILD of Xcode $XCODE_VERSION" >&2
            exit 1
          fi

      - name: Import signing certificate
        env:
          SIGNING_P12: ${{ secrets.SIGNING_P12 }}
          SIGNING_P12_PASSWORD: ${{ secrets.SIGNING_P12_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          keychain_password="$(openssl rand -base64 32)"
          p12="$RUNNER_TEMP/release-signing.p12"
          trap 'rm -f "$p12"' EXIT

          security create-keychain -p "$keychain_password" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$keychain_password" "$KEYCHAIN_PATH"

          printf '%s' "$SIGNING_P12" | base64 --decode > "$p12"
          # The password is in argv, which is fine on a GitHub-hosted runner: one job, one user, no shared ps.
          security import "$p12" -k "$KEYCHAIN_PATH" -P "$SIGNING_P12_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$keychain_password" "$KEYCHAIN_PATH" > /dev/null

          # Put the temporary keychain first in the user search list so codesign finds it.
          keychains=("$KEYCHAIN_PATH")
          while IFS= read -r line; do
            keychains+=("$(printf '%s' "$line" | sed -e 's/^ *"//' -e 's/"$//')")
          done < <(security list-keychains -d user)
          security list-keychains -d user -s "${keychains[@]}"

          # The certificate is self-signed, hence untrusted, and `find-identity -v` would hide it.
          # Pin the identity by the SHA-1 of the certificate inside the .p12 instead. The system
          # openssl (LibreSSL) reads the PKCS#12 that scripts/release_cert.sh wrote.
          if ! cert_pem="$(PASS="$SIGNING_P12_PASSWORD" /usr/bin/openssl pkcs12 -in "$p12" -clcerts -nokeys \
              -passin env:PASS)"; then
            echo "openssl could not read the certificate from SIGNING_P12 (wrong SIGNING_P12_PASSWORD?)" >&2
            exit 1
          fi
          identity="$(printf '%s\n' "$cert_pem" \
            | /usr/bin/openssl x509 -noout -fingerprint -sha1 | sed -e 's/^.*=//' -e 's/://g')"
          if [[ ! "$identity" =~ ^[0-9A-F]{40}$ ]]; then
            echo "could not read the certificate SHA-1 from the .p12: '$identity'" >&2
            exit 1
          fi
          if ! security find-identity -p codesigning "$KEYCHAIN_PATH" | grep -q "$identity"; then
            echo "identity $identity is not in the temporary keychain" >&2
            exit 1
          fi
          echo "SIGN_IDENTITY=$identity" >> "$GITHUB_ENV"

      - name: Build and sign the app
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: bash scripts/package.sh release-app

      - name: Build and sign the DMG
        run: bash scripts/package.sh release-dmg

      - name: Checksum the DMG
        id: verify
        run: |
          set -euo pipefail
          sha256="$(shasum -a 256 "$DMG" | awk '{ print $1 }')"
          if [[ ! "$sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "bad sha256 for $DMG: '$sha256'" >&2
            exit 1
          fi
          echo "sha256=$sha256" >> "$GITHUB_OUTPUT"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" "$DMG" --clobber
          else
            notes="$RUNNER_TEMP/release-notes.md"
            bash scripts/release_notes.sh "$TAG" > "$notes"
            gh release create "$TAG" "$DMG" --verify-tag \
              --title "Hidebar $VERSION" --notes-file "$notes"
          fi

      - name: Update Homebrew tap
        env:
          GH_TOKEN: ${{ secrets.TAP_TOKEN }}
          SHA256: ${{ steps.verify.outputs.sha256 }}
        run: |
          set -euo pipefail
          gh auth setup-git --hostname github.com
          gh repo clone pod2metra/homebrew-tap "$RUNNER_TEMP/tap"

          mkdir -p "$RUNNER_TEMP/tap/Casks"
          cask="$RUNNER_TEMP/tap/Casks/hidebar.rb"
          sed -e "s/@VERSION@/$VERSION/" -e "s/@SHA256@/$SHA256/" \
            packaging/hidebar.rb.template > "$cask"
          if grep -q '@[A-Z0-9]*@' "$cask"; then
            echo "cask still has unfilled placeholders" >&2
            exit 1
          fi
          ruby -c "$cask"
          # brew style resolves a cask by path only inside a Casks/ directory, which the clone provides.
          HOMEBREW_NO_AUTO_UPDATE=1 HOMEBREW_NO_ANALYTICS=1 brew style "$cask"

          cd "$RUNNER_TEMP/tap"
          git add Casks/hidebar.rb
          if git diff --cached --quiet; then
            echo "cask already up to date"
            exit 0
          fi
          git -c user.name="github-actions[bot]" \
            -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -m "chore: update hidebar to $VERSION"
          git push origin HEAD

      - name: Remove signing material
        if: always()
        run: |
          set -euo pipefail
          if [ -n "${KEYCHAIN_PATH:-}" ] && [ -e "$KEYCHAIN_PATH" ]; then
            security delete-keychain "$KEYCHAIN_PATH"
          fi
          rm -f "$RUNNER_TEMP/release-signing.p12"
