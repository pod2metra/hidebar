<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Hidebar logo</title>
<style>
  body { margin: 0; padding: 32px; font: 14px/1.4 -apple-system, "Helvetica Neue", sans-serif; background: #ececef; color: #1d1d1f; }
  h1 { font-size: 20px; margin: 0 0 8px; }
  p { margin: 0 0 24px; color: #555; }
  .row { display: flex; align-items: flex-end; gap: 28px; flex-wrap: wrap; }
  figure { margin: 0; text-align: center; font-size: 11px; color: #888; }
  figure img { display: block; margin: 0 auto 6px; }
  .marks { display: flex; gap: 16px; margin-top: 24px; }
  .bg { display: flex; align-items: center; gap: 20px; padding: 16px 20px; border-radius: 10px; }
  .light { background: #f5f5f7; color: #1d1d1f; }
  .dark { background: #1d1d1f; color: #f5f5f7; }
  .bg svg { display: block; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="mark" viewBox="0 0 64 64">
      <rect x="14.5" y="10" width="8" height="44" rx="4" fill="currentColor"/>
      <path d="M34 19 L47 32 L34 45" fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
    </symbol>
  </defs>
</svg>

<h1>Hidebar logo</h1>
<p>The pipe that hides everything left of it, and the arrow the user clicks.</p>
<div class="row">
  <figure><img src="logo.svg" width="512" height="512" alt="Icon at 512">512</figure>
  <figure><img src="logo.svg" width="128" height="128" alt="Icon at 128">128</figure>
  <figure><img src="logo.svg" width="32" height="32" alt="Icon at 32">32</figure>
</div>
<div class="marks">
  <div class="bg light"><svg width="64" height="64"><use href="#mark"/></svg><svg width="16" height="16"><use href="#mark"/></svg></div>
  <div class="bg dark"><svg width="64" height="64"><use href="#mark"/></svg><svg width="16" height="16"><use href="#mark"/></svg></div>
</div>
</body>
</html>
