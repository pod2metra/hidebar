<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="a-bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#5B6CF0"/>
      <stop offset="1" stop-color="#2A2F9E"/>
    </linearGradient>
    <linearGradient id="a-sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fff" stop-opacity="0.22"/>
      <stop offset="0.5" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- soft shadow as stacked rects: filters are not rendered the same everywhere -->
  <rect x="80" y="92" width="864" height="864" rx="205" fill="#000" fill-opacity="0.035"/>
  <rect x="84" y="96" width="856" height="856" rx="201" fill="#000" fill-opacity="0.035"/>
  <rect x="88" y="100" width="848" height="848" rx="197" fill="#000" fill-opacity="0.035"/>
  <rect x="92" y="104" width="840" height="840" rx="193" fill="#000" fill-opacity="0.035"/>
  <rect x="96" y="108" width="832" height="832" rx="189" fill="#000" fill-opacity="0.035"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#a-bg)"/>
  <rect x="100" y="100" width="824" height="824" rx="185" fill="url(#a-sheen)"/>
  <!-- the pipe: everything left of it is hidden -->
  <rect x="352" y="282" width="64" height="460" rx="32" fill="#fff"/>
  <!-- the arrow right of the pipe -->
  <path d="M552 352 L682 512 L552 672" fill="none" stroke="#fff" stroke-width="76" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
